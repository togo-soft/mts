syntax = "proto3";

package microts.v1;

option go_package = "codeberg.org/micro-ts/mts/types;types";

// ===================================
// 基础类型定义
// ===================================

// 字段值
//
// Point 的字段值使用 oneof 支持多种数据类型。
// 存储引擎会根据值的实际类型进行相应的编码和处理。
//
// 支持的类型：
//
//   - int_value: 64位有符号整数，适用于计数器、ID 等
//   - float_value: 64位浮点数，适用于温度、电压等连续值
//   - string_value: 可变长度字符串，适用于状态描述
//   - bool_value: 布尔值，适用于开关状态
//
// 类型说明：
//
//	写入时根据值的类型自动选择对应的字段。
//	查询时根据实际存储的类型返回相应值。
message FieldValue {
  oneof value {
    int64 int_value = 1;
    double float_value = 2;
    string string_value = 3;
    bool bool_value = 4;
  }
}

// 字段条目（键值对，用于替代 map<string, FieldValue>）
//
// 用于 PointRow 和 Row 消息的字段列表。
// 相比 map，repeated FieldEntry 的优势：
//   - 确定性遍历顺序
//   - 更低的内存开销（无哈希表元数据）
//   - 更好的缓存局部性
message FieldEntry {
  string key = 1;
  FieldValue value = 2;
}

// 数据点
//
// Point 是写入时序数据库的基本数据单元。
// 每个 Point 代表时间序列中的一个数据点。
//
// 必需字段：
//
//   - database: 数据库名称，用于隔离不同业务的数据
//   - measurement: 测量名称，类似关系数据库的表名
//   - timestamp: 纳秒级 Unix 时间戳
//   - tags: 标签键值对，用于标识时间序列
//   - fields: 字段值，存储实际的数据
//
// 标签与字段的区别：
//
//	标签用于索引和分组，会被存储在 Series Key 中，查询效率高。
//	字段存储实际数据值，不会被索引，但可以存储大量不同的值。
//
// 最佳实践：
//
//	标签建议使用 host, region, service 等维度信息。
//	时间戳推荐使用 time.Now().UnixNano() 获取。
message Point {
  // 数据库名称
  string database = 1;

  // 测量名称（类似表名）
  string measurement = 2;

  // 标签键值对，用于标识时间序列
  map<string, string> tags = 3;

  // 时间戳，纳秒级 Unix 时间戳
  int64 timestamp = 4;

  // 字段值，存储实际的数据
  map<string, FieldValue> fields = 5;
}

// 查询结果行
//
// PointRow 是查询结果的单行数据。
// 相比 Point，PointRow 增加了 SID 字段用于内部标识。
//
// 字段说明：
//
//   - sid: Series ID，内部生成的序列标识符（从1开始递增）
//   - timestamp: 数据点的时间戳（纳秒）
//   - tags: 标签键值对
//   - fields: 字段值
//
// SID 说明：
//
//	SID 由存储引擎为每个唯一的标签组合分配。
//	相同的标签组合始终对应同一个 SID。
//	用户通常不需要直接使用此字段。
message PointRow {
  // Series ID，用于内部标识唯一的标签组合
  uint64 sid = 1;

  // 时间戳
  int64 timestamp = 2;

  // 标签键值对
  map<string, string> tags = 3;

  // 字段值（按名访问使用 GetField 辅助方法）
  repeated FieldEntry fields = 4;
}

// ===================================
// gRPC 请求/响应消息
// ===================================

// 写入请求
message WriteRequest {
  string database = 1;
  string measurement = 2;
  map<string, string> tags = 3;
  int64 timestamp = 4;
  map<string, FieldValue> fields = 5;
}

// 批量写入请求
message WriteBatchRequest {
  repeated WriteRequest points = 1;
}

// 写入响应
message WriteResponse {
  bool success = 1;
  string error = 2;
}

// 批量写入响应
message WriteBatchResponse {
  bool success = 1;
  string error = 2;
  int32 count = 3;
}

// 范围查询请求
message QueryRangeRequest {
  string database = 1;
  string measurement = 2;
  int64 start_time = 3;
  int64 end_time = 4;
  repeated string fields = 5;
  map<string, string> tags = 6;
  int64 offset = 7;
  int64 limit = 8;
}

// 范围查询响应
//
// 封装范围查询的结果，包含所有查询到的数据行。
message QueryRangeResponse {
  repeated Row rows = 1;
  bool has_more = 2;
}

// 一行数据（用于查询响应）
message Row {
  int64 timestamp = 1;
  map<string, string> tags = 2;
  repeated FieldEntry fields = 3;
}

// 列出 Measurement 请求
message ListMeasurementsRequest {
  string database = 1;
}

// 列出 Measurement 响应
message ListMeasurementsResponse {
  repeated string measurements = 1;
}

// 创建 Measurement 请求
message CreateMeasurementRequest {
  string database = 1;
  string measurement = 2;
}

// 创建 Measurement 响应
message CreateMeasurementResponse {
  bool success = 1;
  string error = 2;
}

// 删除 Measurement 请求
message DropMeasurementRequest {
  string database = 1;
  string measurement = 2;
}

// 删除 Measurement 响应
message DropMeasurementResponse {
  bool success = 1;
  string error = 2;
}

// 列出数据库请求
message ListDatabasesRequest {}

// 列出数据库响应
message ListDatabasesResponse {
  repeated string databases = 1;
}

// 创建数据库请求
message CreateDatabaseRequest {
  string database = 1;
}

// 创建数据库响应
message CreateDatabaseResponse {
  bool success = 1;
  string error = 2;
}

// 删除数据库请求
message DropDatabaseRequest {
  string database = 1;
}

// 删除数据库响应
message DropDatabaseResponse {
  bool success = 1;
  string error = 2;
}

// 健康检查请求
message HealthRequest {}

// 健康检查响应
message HealthResponse {
  bool healthy = 1;
  string version = 2;
}

// ===================================
// 内部元数据类型（Measurement 元数据）
// ===================================

// 内存表配置
//
// 内存表（MemTable）是写入缓冲区，数据先写入 MemTable，
// 当满足任一条件时刷新到 SSTable。
//
// 刷新条件（满足任一即触发）：
//
//   - flush_size: 内存占用（估算）达到此值
//   - flush_count: 条目数达到此值
//   - flush_idle_nanos: 超过此空闲时间没有新数据写入（纳秒）
//
// 性能调优建议：
//
//	增加 flush_size 可以减少刷盘频率，但会增加内存占用和恢复时间。
//	减少 flush_idle_nanos 可以更快释放内存，但会增加小文件数量。
//	flush_count 主要作为后备保护。
//
// 默认值：
//
//   - flush_size: 64MB
//   - flush_count: 50000
//   - flush_idle_nanos: 60秒（60000000000纳秒）
message MemTableConfig {
  // 触发刷盘的内存大小阈值（字节），默认 64MB
  int64 flush_size = 1;

  // 触发刷盘的条目数阈值，默认 50000
  int32 flush_count = 2;

  // 触发刷盘的空闲时间阈值（纳秒），默认 60秒
  int64 flush_idle_nanos = 3;
}

// Compaction 配置
//
// CompactionConfig 控制 SSTable 合并（compaction）行为。
// Compaction 是 LSM 存储引擎的核心维护操作，通过合并多个 SSTable 减少文件数量、
// 提升查询性能并清理过期或已删除数据。
//
// 触发条件：
//
//   - SSTable 数量达到 max_sstable_count 阈值
//   - 定时检查间隔 check_interval_nanos
//
// 默认值：
//
//   - max_sstable_count: 4
//   - max_compaction_batch: 0（不限制）
//   - shard_size_limit: 1GB
//   - check_interval_nanos: 1 小时（3600000000000 纳秒）
//   - timeout_nanos: 30 分钟（1800000000000 纳秒）
message CompactionConfig {
  // 最大 SSTable 数量，超过此值触发 compaction
  int32 max_sstable_count = 1;

  // 单次 compaction 最大文件数（0 表示不限制）
  int32 max_compaction_batch = 2;

  // 单个 Shard 数据大小上限（字节），超过后不参与 compaction
  int64 shard_size_limit = 3;

  // 定时触发间隔（纳秒），0 表示禁用定时触发
  int64 check_interval_nanos = 4;

  // Compaction 超时时间（纳秒）
  int64 timeout_nanos = 5;
}

// 引擎配置
//
// Config 是数据库的完整配置结构。
// 这是存储引擎使用的配置，包含数据目录、分片时长和内存表配置。
//
// 字段说明：
//
//   - data_dir: 数据存储目录路径
//   - shard_duration_nanos: Shard 时间窗口（纳秒），最小 1 小时
//   - mem_table_cfg: 内存表配置
//
// ShardDuration 说明：
//
//	ShardDuration 控制数据在磁盘上的分片大小。
//	较小的值会产生更多小文件，利于过期数据快速清理。
//	较大的值减少文件数量，提高大时间范围查询效率。
//	建议值：1小时(3600000000000) - 7天(604800000000000)。
message Config {
  // 数据目录
  string data_dir = 1;

  // Shard 时间窗口（纳秒）
  int64 shard_duration_nanos = 2;

  // 内存表配置
  MemTableConfig mem_table_cfg = 3;
}

// ===================================
// gRPC 服务定义
// ===================================

// MicroTS 时序数据库服务
//
// 提供完整的时序数据库远程访问接口，包括：
//
//   - 数据写入：单点写入、批量写入
//   - 数据查询：范围查询、分页支持
//   - 元数据管理：数据库和 Measurement 的增删改查
//   - 健康检查：服务状态查询
//
// 并发安全：
//
//	所有 RPC 方法都可以从多个 goroutine 并发调用。
//	gRPC 框架保证每个请求在独立的 goroutine 中处理。
service MicroTS {
  // 单点写入
  //
  // 将单个数据点写入时序数据库。
  // 数据首先写入 WAL，然后写入 MemTable。
  rpc Write(WriteRequest) returns (WriteResponse);

  // 批量写入
  //
  // 批量写入多个数据点，吞吐量通常比单点写入高。
  // 批量写入不是原子操作，部分失败不会回滚已写入的点。
  rpc WriteBatch(WriteBatchRequest) returns (WriteBatchResponse);

  // 范围查询
  //
  // 查询指定时间范围内的数据，支持字段过滤、标签过滤和分页。
  // 数据按时间戳升序返回。
  rpc QueryRange(QueryRangeRequest) returns (stream Row);

  // 列出 Measurement
  //
  // 返回指定数据库中的所有 Measurement 名称。
  // 如果数据库不存在，返回空列表。
  rpc ListMeasurements(ListMeasurementsRequest) returns (ListMeasurementsResponse);

  // 创建 Measurement
  //
  // 在指定数据库中创建一个新的 Measurement。
  // 如果数据库不存在，会自动创建。
  // 如果 Measurement 已存在，不会返回错误。
  rpc CreateMeasurement(CreateMeasurementRequest) returns (CreateMeasurementResponse);

  // 删除 Measurement
  //
  // 删除指定的 Measurement 及其所有元数据。
  // 注意：磁盘上的数据文件不会被立即删除。
  rpc DropMeasurement(DropMeasurementRequest) returns (DropMeasurementResponse);

  // 列出数据库
  //
  // 返回所有数据库名称列表。
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);

  // 创建数据库
  //
  // 创建一个新的数据库。
  // 如果数据库已存在，不会返回错误。
  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse);

  // 删除数据库
  //
  // 删除指定的数据库及其所有 Measurement。
  // 警告：此操作会永久删除元数据，且不可恢复。
  rpc DropDatabase(DropDatabaseRequest) returns (DropDatabaseResponse);

  // 健康检查
  //
  // 返回服务的健康状态，用于负载均衡器健康检查和监控。
  rpc Health(HealthRequest) returns (HealthResponse);
}
